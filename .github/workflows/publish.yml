name: Publish verified addon
on:
  push:
    branches: [main]
    paths:
      - HolyLightEclipse/**
      - downloads/**
      - docs/screenshots/**
      - scripts/verify_release.py
      - .github/workflows/publish.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify packaged release and screenshots
        run: python3 scripts/verify_release.py
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.9.5 >/dev/null 2>&1; then
            gh release create v0.9.5 --target "${{ github.sha }}" --title "Holy Light x Eclipse 0.9.5 — Rehard" --notes-file RELEASE-NOTES.md --latest
          fi
          gh release upload v0.9.5 downloads/HolyLightEclipse-0.9.5.zip downloads/SHA256SUMS-0.9.5.txt --clobber
